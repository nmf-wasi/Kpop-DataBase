name: Run Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: 1234
                    POSTGRES_DB: kpop_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7
                ports:
                    - 6379:6379

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run tests
              env:
                  SECRET_KEY: ${{secrets.SECRET_KEY}}
                  TESTING: "True"
                  DATABASE_URL: postgresql+psycopg2://postgres:1234@localhost:5432/kpop_test
                  TEST_DATABASE_URL: postgresql+psycopg2://postgres:1234@localhost:5432/kpop_test
                  REDIS_HOST: localhost
              run: pytest
